# One block per sensor. The top-level key is the node name, so adding a sensor means adding a
# block and nothing else. The names below are examples; call them whatever fits the robot.
#
# can_interface differs from machine to machine, so point params_file at a copy rather than
# editing this file:
#   ros2 launch aidin_aft150_d50_bringup aft150_d50.launch.py params_file:=~/my_aft150.yaml

right_wrist_ft:
  ros__parameters:
    can_interface: can0
    can_mode:      fd_brs
    data_type:     float_combined
    rate_hz:       250
    set_id_can20:  0x430
    set_id_canfd:  0x330

left_wrist_ft:
  ros__parameters:
    can_interface: can1
    can_mode:      fd_brs
    data_type:     float_combined
    rate_hz:       250
    set_id_can20:  0x430
    set_id_canfd:  0x330
