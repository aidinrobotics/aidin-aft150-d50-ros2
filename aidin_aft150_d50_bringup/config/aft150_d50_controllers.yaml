# Settings for controller_manager itself. The broadcasters are not listed here: the launch file
# derives one per sensor from aft150_d50_params.yaml, so the sensor list stays in one place.
#
# update_rate is how often controller_manager calls read() on the hardware. It is not the sensor
# rate — rate_hz in aft150_d50_params.yaml sets that — but reading slower than the sensor sends
# means skipping samples, so keep this at or above the highest rate_hz in use.

controller_manager:
  ros__parameters:
    update_rate: 1000
